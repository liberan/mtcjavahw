name: Print Date and Time

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  print-datetime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Print current date and time
        run: |
          echo "Current date and time:"
          date