spring:
  application:
    name: angelikaliber
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: 8080

app:
  name: To-Do List Manager
  version: 0.0.1-SNAPSHOT
  api-version: 2.0.0
  upload-dir: uploads

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
